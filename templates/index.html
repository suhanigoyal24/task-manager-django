<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="auth-container">
        <h1>📋 Team Task Manager</h1>
        
        <div class="auth-forms">
            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <h2>Login</h2>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
                <p class="switch-form">Don't have an account? <a href="#" id="showSignup">Sign up</a></p>
                <div id="loginError" class="error-msg"></div>
            </form>

            <!-- Signup Form -->
            <form id="signupForm" class="auth-form hidden">
                <h2>Sign Up</h2>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="signupUsername" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="signupPassword2" required>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="signupRole">
                        <option value="member">Member</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Create Account</button>
                <p class="switch-form">Already have an account? <a href="#" id="showLogin">Login</a></p>
                <div id="signupError" class="error-msg"></div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        
        // Toggle forms
        document.getElementById('showSignup').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.remove('hidden');
            clearErrors();
        });
        
        document.getElementById('showLogin').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            clearErrors();
        });
        
        function clearErrors() {
            document.getElementById('loginError').textContent = '';
            document.getElementById('signupError').textContent = '';
        }
        
        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearErrors();
            
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                const response = await fetch(`${API_BASE}/auth/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    document.getElementById('loginError').textContent = data.detail || 'Login failed';
                    return;
                }
                
                localStorage.setItem('access', data.access);
                localStorage.setItem('refresh', data.refresh);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                window.location.href = '/dashboard/';
            } catch (err) {
                document.getElementById('loginError').textContent = 'Network error';
            }
        });
        
        // Signup
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearErrors();
            
            const data = {
                username: document.getElementById('signupUsername').value,
                email: document.getElementById('signupEmail').value,
                password: document.getElementById('signupPassword').value,
                password2: document.getElementById('signupPassword2').value,
                role: document.getElementById('signupRole').value
            };
            
            try {
                const response = await fetch(`${API_BASE}/auth/register/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (!response.ok) {
                    document.getElementById('signupError').textContent = JSON.stringify(result);
                    return;
                }
                
                // Auto login
                const loginResp = await fetch(`${API_BASE}/auth/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: data.username, password: data.password })
                });
                
                const loginData = await loginResp.json();
                localStorage.setItem('access', loginData.access);
                localStorage.setItem('refresh', loginData.refresh);
                localStorage.setItem('user', JSON.stringify(loginData.user));
                
                window.location.href = '/dashboard/';
            } catch (err) {
                document.getElementById('signupError').textContent = 'Network error';
            }
        });
        
        // Check if already logged in
        if (localStorage.getItem('access')) {
            window.location.href = '/dashboard/';
        }
    </script>
</body>
</html>
